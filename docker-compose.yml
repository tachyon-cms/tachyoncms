services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tachyon
      POSTGRES_PASSWORD: tachyon
      POSTGRES_DB: tachyon
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned folder under this path.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
