name: Release

# Cut a release: tag the current main, build and smoke-test a binary for each
# platform, then sign, attest and upload everything as a draft GitHub release
# and push the image to GHCR. A maintainer writes the notes and publishes.
# On a pull request that touches the release, it builds everything and
# publishes nothing. Every job checks out github.sha, which is the commit
# the tag points at.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (for example 0.1.0)
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release.Containerfile
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  IMAGE: ghcr.io/tachyon-cms/tachyoncms

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "version=$crate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$REF" = refs/heads/main ] || { echo "releases are cut from main" >&2; exit 1; }
          echo "$INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "version must look like 0.1.0 or 0.2.0-rc.1" >&2; exit 1; }
          # The binary reports the crate version, so the two have to agree.
          [ "$INPUT" = "$crate" ] \
            || { echo "Cargo.toml says $crate; bump it in a PR first" >&2; exit 1; }
          echo "version=$INPUT" >> "$GITHUB_OUTPUT"
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, platform: linux/amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-auditable
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # cargo-auditable records the dependency tree inside the binary, so the
      # SBOM describes exactly what was linked, not everything in Cargo.lock.
      - name: Build
        run: cargo auditable build --release --locked -p tachyon --target ${{ matrix.target }}
      - name: The binary runs and reports its version
        run: |
          bin=target/${{ matrix.target }}/release/tachyon
          "$bin" --version | tee version.txt
          [ "$(cat version.txt)" = "tachyon $VERSION" ] || { echo "wrong version" >&2; exit 1; }
      - name: The Linux binary is static
        if: contains(matrix.target, 'musl')
        run: |
          file target/${{ matrix.target }}/release/tachyon | tee file.txt
          grep -Eq 'static(-pie)? linked' file.txt || { echo "not statically linked" >&2; exit 1; }
      - name: Package
        run: |
          name=tachyon_${VERSION}_${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/tachyon LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if [ -n "${{ matrix.platform }}" ]; then
            mkdir -p "image/${{ matrix.platform }}"
            cp target/${{ matrix.target }}/release/tachyon "image/${{ matrix.platform }}/"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/
            image/
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: SBOMs and checksums
        working-directory: dist
        run: |
          for f in *.tar.gz; do
            syft scan "dir:${f%.tar.gz}" -o "spdx-json=$f.sbom.json"
            # An SBOM that lists no crates means the audit data went missing.
            jq -e '[.packages[] | select(.name == "axum")] | length > 0' "$f.sbom.json" >/dev/null \
              || { echo "$f.sbom.json lists no Rust crates" >&2; exit 1; }
          done
          sha256sum *.tar.gz *.sbom.json > checksums.txt
          cat checksums.txt
      - name: Sign the checksums
        if: env.PUBLISH == 'true'
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the image
        id: image
        env:
          REVISION: ${{ github.sha }}
        run: |
          chmod +x image/linux/*/tachyon
          tags=(-t "$IMAGE:v$VERSION")
          # Pre-releases never move latest.
          case "$VERSION" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          labels=(
            --label org.opencontainers.image.title=tachyon
            --label "org.opencontainers.image.description=A headless CMS written in Rust."
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$REVISION"
            --label "org.opencontainers.image.version=$VERSION"
            --label org.opencontainers.image.licenses=MIT
          )
          # Check each platform runs before anything is pushed.
          for p in linux/amd64 linux/arm64; do
            docker buildx build --platform "$p" -f release.Containerfile "${labels[@]}" -t smoke --load image
            docker run --rm --platform "$p" smoke --version | grep -Fx "tachyon $VERSION"
          done
          if [ "$PUBLISH" = true ]; then
            docker buildx build --platform linux/amd64,linux/arm64 -f release.Containerfile \
              "${labels[@]}" "${tags[@]}" --metadata-file meta.json --push image
            echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Draft the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in 0.*|*-*) prerelease=(--prerelease) ;; esac
          cat > notes.md <<EOF
          Notes to come.

          ## Verify a download

          \`\`\`sh
          cosign verify-blob \\
            --certificate-identity 'https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --bundle checksums.txt.sigstore.json checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          \`\`\`
          EOF
          gh release create "v$VERSION" --draft --verify-tag "${prerelease[@]}" \
            --title "v$VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/*.sbom.json dist/checksums.txt dist/checksums.txt.sigstore.json
